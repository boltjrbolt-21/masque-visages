<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Masque Visages</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#000; --fg:#f2f2f2; --muted:#9a9a9a; --rec:#ff3b30; --ok:#34c759; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; max-height: 100%; }
  /* pas de display:none : Safari iOS ne lit pas une vidéo masquée ainsi, play() ne se termine jamais */
  video { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
    padding: calc(env(safe-area-inset-top,0px) + 10px) 16px 10px; background: linear-gradient(#000c, #0000); gap: 10px; }
  #status { font-size: 13px; color: var(--muted); }
  #status.ok { color: var(--ok); }
  #bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; align-items: center;
    padding: 16px 16px calc(env(safe-area-inset-bottom,0px) + 22px); background: linear-gradient(#0000, #000c); }
  button { background: #ffffff22; color: var(--fg); border: 0; border-radius: 999px; padding: 10px 14px; font: inherit; }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  #shot { width: 72px; height: 72px; border-radius: 50%; background: #fff; border: 5px solid #ffffff55; padding: 0; }
  #rec { width: 56px; height: 56px; border-radius: 50%; background: var(--rec); padding: 0; }
  #rec.on { border-radius: 14px; animation: p 1s infinite; }
  @keyframes p { 50% { opacity: .5; } }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center;
    padding: 24px; text-align: center; background: var(--bg); z-index: 5; }
  #start p { max-width: 34ch; color: var(--muted); margin: 0; }
  #go { background: #fff; color: #000; font-weight: 600; padding: 14px 26px; }
  select { background: #ffffff22; color: var(--fg); border: 0; border-radius: 999px; padding: 8px 10px; font: inherit; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
</style>
</head>
<body>
<div id="start">
  <h2 style="margin:0">Masque Visages</h2>
  <p>Chaque visage détecté est recouvert d'un ovale noir plein, directement dans l'image enregistrée. Rien n'est envoyé sur un serveur.</p>
  <button id="go">Ouvrir la caméra</button>
  <button class="pick">Masquer une photo ou vidéo</button>
  <p id="err" style="color:var(--rec)"></p>
</div>

<div id="stage"><canvas id="out"></canvas></div>
<video id="cam" playsinline muted></video>
<input type="file" id="file" accept="image/*,video/*" hidden>

<div id="top">
  <span id="status">Chargement…</span>
  <select id="pad" aria-label="Marge du masque">
    <option value="0.2">Marge 20 %</option>
    <option value="0.25">Marge 25 %</option>
    <option value="0.5" selected>Marge 50 %</option>
    <option value="0.8">Marge 80 %</option>
  </select>
</div>

<div id="bar">
  <button id="flip">Retourner</button>
  <button class="pick">Fichier</button>
  <button id="shot" aria-label="Prendre une photo"></button>
  <button id="rec" aria-label="Filmer"></button>
</div>
<div id="flash"></div>

<script type="module">
import { FaceDetector, PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const video = $("cam"), out = $("out"), ctx = out.getContext("2d");
let detector, pose, stream, facing = "environment", recorder, chunks = [];
let still = null, ready, looping = false, audioCtx, audioDest; // still : photo chargée, affichée à la place de la vidéo
let memory = [];            // boîtes récentes, gardées quelques images pour éviter les "trous"
const HOLD_MS = 600;        // un visage reste masqué 0,6 s après sa dernière détection

async function loadDetector() {
  const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = d => ({
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite", delegate: d },
    runningMode: "VIDEO", minDetectionConfidence: 0.3, minSuppressionThreshold: 0.3
  });
  // CPU : le délégué GPU peut bloquer sans erreur sur Safari iOS ; BlazeFace reste rapide sur CPU
  // La pose repère aussi les têtes de profil, de dos ou lointaines, que BlazeFace (visages de face, < 2 m) rate.
  [detector, pose] = await Promise.all([
    FaceDetector.createFromOptions(fs, opts("CPU")),
    PoseLandmarker.createFromOptions(fs, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task", delegate: "CPU" },
      runningMode: "VIDEO", numPoses: 4, minPoseDetectionConfidence: 0.3, minPosePresenceConfidence: 0.3
    })
  ]);
}

// Points 0 à 10 de la pose = nez, yeux, oreilles, bouche. On en tire une boîte de tête.
// ponytail: tailles empiriques (1,3 × largeur, 1,6 × hauteur, testées sur un profil) ; ajuster si un crâne dépasse.
function headBox(lm) {
  const xs = lm.slice(0, 11).map(p => p.x * out.width), ys = lm.slice(0, 11).map(p => p.y * out.height);
  const s = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
  const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2;
  return { originX: cx - s * 0.65, originY: cy - s * 0.8, width: s * 1.3, height: s * 1.6 };
}

const loadOnce = () => ready ??= loadDetector();
const startLoop = () => { if (!looping) { looping = true; loop(); } };

async function openCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  still = null; memory = []; video.removeAttribute("src"); video.muted = true;
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: true
  }).catch(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: false }));
  video.srcObject = stream;
  await video.play();
  out.width = video.videoWidth; out.height = video.videoHeight;
}

function loop() {
  const now = performance.now();
  const src = still || video;
  const W = still ? still.naturalWidth : video.videoWidth, H = still ? still.naturalHeight : video.videoHeight;
  if ((still || video.readyState >= 2) && detector) {
    if (out.width !== W || out.height !== H) { out.width = W; out.height = H; }
    // On dessine d'abord, puis on détecte sur le canvas : masque et image viennent de la même frame,
    // même si la vidéo avance pendant la détection.
    ctx.drawImage(src, 0, 0, out.width, out.height);
    const res = detector.detectForVideo(out, now);
    for (const d of res.detections) memory.push({ b: d.boundingBox, t: now });
    const heads = pose.detectForVideo(out, now).landmarks;
    for (const lm of heads) memory.push({ b: headBox(lm), t: now });
    memory = memory.filter(m => now - m.t < HOLD_MS);

    const pad = parseFloat($("pad").value);
    ctx.fillStyle = "#000";
    // Ovale inscrit dans l'ancien rectangle : couvre encore les 4 coins de la boîte détectée
    // (marge 25 % : 0,91 < 1 ; à 20 %, 1,04 : les coins bas de la boîte, à côté du menton, sont effleurés)
    // et libère ~21 % d'image (π/4 du rectangle).
    ctx.beginPath();
    for (const { b } of memory) {
      const px = b.width * pad, py = b.height * pad;
      const x = b.originX - px, y = b.originY - py * 1.3, w = b.width + 2 * px, h = b.height + 2.3 * py;
      ctx.moveTo(x + w, y + h / 2);
      ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, 2 * Math.PI);
    }
    ctx.fill();
    const n = Math.max(res.detections.length, heads.length);
    $("status").textContent = n ? `${n} visage${n > 1 ? "s" : ""} masqué${n > 1 ? "s" : ""}` : "Aucun visage";
    $("status").className = n ? "ok" : "";
  }
  requestAnimationFrame(loop);
}

async function save(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch {}
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

const stamp = () => new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);

$("shot").onclick = () => {
  $("flash").style.opacity = 1; setTimeout(() => $("flash").style.opacity = 0, 120);
  out.toBlob(b => save(b, `photo-${stamp()}.jpg`), "image/jpeg", 0.92);
};

function startRec(audioTracks) {
  const s = out.captureStream(30);
  audioTracks.forEach(t => s.addTrack(t));
  const type = ["video/mp4", "video/webm;codecs=vp9", "video/webm"].find(t => MediaRecorder.isTypeSupported(t)) || "";
  recorder = new MediaRecorder(s, type ? { mimeType: type, videoBitsPerSecond: 6e6 } : {});
  chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    $("rec").classList.remove("on");
    const blob = new Blob(chunks, { type: recorder.mimeType });
    save(blob, `video-${stamp()}.${recorder.mimeType.includes("mp4") ? "mp4" : "webm"}`);
  };
  recorder.start(500);
  $("rec").classList.add("on");
}

$("rec").onclick = () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  if (stream) startRec(stream.getAudioTracks());
};

// Fichier choisi : une photo s'affiche masquée (rond blanc pour l'enregistrer) ;
// une vidéo est rejouée en temps réel, masquée et enregistrée jusqu'à sa fin.
// ponytail: traitement en temps réel, donc limité par la vitesse du téléphone ; passer image par image si ça saute.
async function openFile(file) {
  if (!file || (recorder && recorder.state === "recording")) return;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  memory = [];
  const url = URL.createObjectURL(file);
  if (file.type.startsWith("image/")) {
    const img = new Image(); img.src = url; await img.decode();
    video.pause(); still = img;
    return;
  }
  still = null; video.srcObject = null; video.src = url; video.muted = false;
  if (!audioCtx) {
    audioCtx = new AudioContext(); audioDest = audioCtx.createMediaStreamDestination();
    audioCtx.createMediaElementSource(video).connect(audioDest); // le son part dans l'enregistrement, pas dans le haut-parleur
  }
  audioCtx.resume();
  await video.play().catch(() => { video.muted = true; return video.play(); }); // sans son si Safari refuse
  video.onended = () => recorder && recorder.state === "recording" && recorder.stop();
  startRec(audioDest.stream.getAudioTracks());
}

document.querySelectorAll(".pick").forEach(b => b.onclick = () => $("file").click());
$("file").onchange = async () => {
  const file = $("file").files[0]; $("file").value = "";
  try {
    $("err").textContent = "Chargement du détecteur…";
    await loadOnce();
    $("start").style.display = "none";
    startLoop();
    await openFile(file);
  } catch (e) { $("err").textContent = "Échec : " + e.message; }
};

$("flip").onclick = async () => {
  if (recorder && recorder.state === "recording") return;
  facing = facing === "environment" ? "user" : "environment";
  await openCam();
};

$("go").onclick = async () => {
  $("go").disabled = true; $("go").textContent = "Chargement du détecteur…";
  try {
    const timeout = new Promise((_, ko) => setTimeout(() => ko(new Error("le détecteur ne répond pas après 40 s")), 40000));
    const step = (p, nom) => p.then(() => { $("err").textContent += nom + " OK · "; });
    await Promise.race([Promise.all([step(loadOnce(), "détecteur"), step(openCam(), "caméra")]), timeout]);
    $("start").style.display = "none"; // .hidden ne suffit pas : le CSS #start impose display:flex
    startLoop();
  } catch (e) {
    $("err").textContent += "Échec : " + e.message;
    $("go").disabled = false; $("go").textContent = "Réessayer";
  }
};
</script>
</body>
</html>
