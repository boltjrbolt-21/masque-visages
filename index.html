<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Masque Visages</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#000; --fg:#f2f2f2; --muted:#9a9a9a; --rec:#ff3b30; --ok:#34c759; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; max-height: 100%; }
  /* pas de display:none : Safari iOS ne lit pas une vidéo masquée ainsi, play() ne se termine jamais */
  video { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
    padding: calc(env(safe-area-inset-top,0px) + 10px) 16px 10px; background: linear-gradient(#000c, #0000); gap: 10px; }
  #status { font-size: 13px; color: var(--muted); }
  #status.ok { color: var(--ok); }
  #bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; align-items: center;
    padding: 16px 16px calc(env(safe-area-inset-bottom,0px) + 22px); background: linear-gradient(#0000, #000c); }
  button { background: #ffffff22; color: var(--fg); border: 0; border-radius: 999px; padding: 10px 14px; font: inherit; }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  #shot { width: 72px; height: 72px; border-radius: 50%; background: #fff; border: 5px solid #ffffff55; padding: 0; }
  #rec { width: 56px; height: 56px; border-radius: 50%; background: var(--rec); padding: 0; }
  #rec.on { border-radius: 14px; animation: p 1s infinite; }
  @keyframes p { 50% { opacity: .5; } }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center;
    padding: 24px; text-align: center; background: var(--bg); z-index: 5; }
  #start p { max-width: 34ch; color: var(--muted); margin: 0; }
  #go { background: #fff; color: #000; font-weight: 600; padding: 14px 26px; }
  select { background: #ffffff22; color: var(--fg); border: 0; border-radius: 999px; padding: 8px 10px; font: inherit; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
</style>
</head>
<body>
<div id="start">
  <h2 style="margin:0">Masque Visages</h2>
  <p>Chaque visage détecté est recouvert d'un carré noir plein, directement dans l'image enregistrée. Rien n'est envoyé sur un serveur.</p>
  <button id="go">Ouvrir la caméra</button>
  <p id="err" style="color:var(--rec)"></p>
</div>

<div id="stage"><canvas id="out"></canvas></div>
<video id="cam" playsinline muted></video>

<div id="top">
  <span id="status">Chargement…</span>
  <select id="pad" aria-label="Marge du carré">
    <option value="0.25">Marge 25 %</option>
    <option value="0.5" selected>Marge 50 %</option>
    <option value="0.8">Marge 80 %</option>
  </select>
</div>

<div id="bar">
  <button id="flip">Retourner</button>
  <button id="shot" aria-label="Prendre une photo"></button>
  <button id="rec" aria-label="Filmer"></button>
</div>
<div id="flash"></div>

<script type="module">
import { FaceDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const video = $("cam"), out = $("out"), ctx = out.getContext("2d");
let detector, stream, facing = "environment", recorder, chunks = [];
let memory = [];            // boîtes récentes, gardées quelques images pour éviter les "trous"
const HOLD_MS = 600;        // un visage reste masqué 0,6 s après sa dernière détection

async function loadDetector() {
  const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = d => ({
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite", delegate: d },
    runningMode: "VIDEO", minDetectionConfidence: 0.3, minSuppressionThreshold: 0.3
  });
  // CPU : le délégué GPU peut bloquer sans erreur sur Safari iOS ; BlazeFace reste rapide sur CPU
  detector = await FaceDetector.createFromOptions(fs, opts("CPU"));
}

async function openCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: true
  }).catch(() => navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: false }));
  video.srcObject = stream;
  await video.play();
  out.width = video.videoWidth; out.height = video.videoHeight;
}

function loop() {
  const now = performance.now();
  if (video.readyState >= 2 && detector) {
    if (out.width !== video.videoWidth) { out.width = video.videoWidth; out.height = video.videoHeight; }
    const res = detector.detectForVideo(video, now);
    for (const d of res.detections) memory.push({ b: d.boundingBox, t: now });
    memory = memory.filter(m => now - m.t < HOLD_MS);

    ctx.drawImage(video, 0, 0, out.width, out.height);
    const pad = parseFloat($("pad").value);
    ctx.fillStyle = "#000";
    for (const { b } of memory) {
      const px = b.width * pad, py = b.height * pad;
      ctx.fillRect(b.originX - px, b.originY - py * 1.3, b.width + 2 * px, b.height + 2 * py + py * 0.3);
    }
    const n = res.detections.length;
    $("status").textContent = n ? `${n} visage${n > 1 ? "s" : ""} masqué${n > 1 ? "s" : ""}` : "Aucun visage";
    $("status").className = n ? "ok" : "";
  }
  requestAnimationFrame(loop);
}

async function save(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch {}
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

const stamp = () => new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);

$("shot").onclick = () => {
  $("flash").style.opacity = 1; setTimeout(() => $("flash").style.opacity = 0, 120);
  out.toBlob(b => save(b, `photo-${stamp()}.jpg`), "image/jpeg", 0.92);
};

$("rec").onclick = () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  const s = out.captureStream(30);
  stream.getAudioTracks().forEach(t => s.addTrack(t));
  const type = ["video/mp4", "video/webm;codecs=vp9", "video/webm"].find(t => MediaRecorder.isTypeSupported(t)) || "";
  recorder = new MediaRecorder(s, type ? { mimeType: type, videoBitsPerSecond: 6e6 } : {});
  chunks = [];
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    $("rec").classList.remove("on");
    const blob = new Blob(chunks, { type: recorder.mimeType });
    save(blob, `video-${stamp()}.${recorder.mimeType.includes("mp4") ? "mp4" : "webm"}`);
  };
  recorder.start(500);
  $("rec").classList.add("on");
};

$("flip").onclick = async () => {
  if (recorder && recorder.state === "recording") return;
  facing = facing === "environment" ? "user" : "environment";
  await openCam();
};

$("go").onclick = async () => {
  $("go").disabled = true; $("go").textContent = "Chargement du détecteur…";
  try {
    const timeout = new Promise((_, ko) => setTimeout(() => ko(new Error("le détecteur ne répond pas après 40 s")), 40000));
    const step = (p, nom) => p.then(() => { $("err").textContent += nom + " OK · "; });
    await Promise.race([Promise.all([step(loadDetector(), "détecteur"), step(openCam(), "caméra")]), timeout]);
    $("start").style.display = "none"; // .hidden ne suffit pas : le CSS #start impose display:flex
    loop();
  } catch (e) {
    $("err").textContent += "Échec : " + e.message;
    $("go").disabled = false; $("go").textContent = "Réessayer";
  }
};
</script>
</body>
</html>
